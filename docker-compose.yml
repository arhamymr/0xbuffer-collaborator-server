services:
  collaborator:
    build: .
    container_name: zeroxbuffer-collaborator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP__SERVER__HOST: 0.0.0.0
      APP__SERVER__PORT: 8080
      APP__HTTP__HOST: 0.0.0.0
      APP__HTTP__PORT: 8081
      APP__DNS__HOST: 0.0.0.0
      APP__DNS__UDP_PORT: 53
      APP__DNS__TCP_PORT: 53
      APP__DOMAIN__ROOT: ${COLLAB_DOMAIN:-collab.company.com}
      APP__SECURITY__API_KEY: ${APP_API_KEY:-change_me}
      APP__DATABASE__PATH: /data/0xbuffer.db
    expose:
      - "8080"
      - "8081"
    volumes:
      - collaborator-sqlite:/data
    ports:
      - "53:53/udp"
      - "53:53/tcp"

  caddy:
    image: caddy:2
    container_name: zeroxbuffer-caddy
    restart: unless-stopped
    depends_on:
      - collaborator
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  collaborator-sqlite:
  caddy-data:
  caddy-config:
